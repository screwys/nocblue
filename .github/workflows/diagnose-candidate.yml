name: diagnose candidate image

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install container tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman

      - name: trace candidate verification
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_ref=ghcr.io/screwys/nocblue@sha256:0c78f2febbffd5c736aeb6357a5f9bf7cd3ef752426660e334a5f9e4e74d7d39
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo podman run --rm --privileged --hostname desktop \
            --volume "$PWD/files/system/usr/bin/nocblue-tests:/tests/nocblue-tests:ro" \
            --entrypoint /usr/bin/bash "$image_ref" -c '
            set -euo pipefail
            systemd-tmpfiles --create \
              /usr/lib/tmpfiles.d/rpm-ostree-0-integration-opt-usrlocal.conf \
              /usr/lib/tmpfiles.d/99-bluebuild-optfix-*.conf
            /usr/libexec/nocblue/validate-fedora-openrazer-compat.sh
            if command -v selinuxenabled >/dev/null 2>&1 && selinuxenabled; then
              printf "SELinux is enabled in the candidate container\n"
            else
              printf "SELinux is disabled in the candidate container\n"
            fi
            /usr/bin/bash /tests/nocblue-tests
            sockdir="$(mktemp -d /run/nocblue-bwrap-sock.XXXXXX)"
            trap "rm -rf \"$sockdir\"" EXIT
            python3 -c "import socket, sys; s = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM); s.bind(sys.argv[1])" "$sockdir/socket"
            printf "checking uv with a bound socket\n"
            /usr/bin/bwrap \
              --dev-bind / / \
              --bind "$sockdir" "$sockdir" \
              --ro-bind "$sockdir/socket" "$sockdir/socket" \
              --ro-bind /dev/null /etc/ld.so.preload \
              -- /usr/bin/uv --version >/dev/null
            printf "checking uvx without a bound socket\n"
            /usr/bin/bwrap \
              --dev-bind / / \
              --ro-bind /dev/null /etc/ld.so.preload \
              -- /usr/bin/uvx --version >/dev/null
          '
          sudo podman run --rm --network=none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,mode=1777 \
            --volume "$PWD/.github:/tests:ro" \
            --entrypoint /usr/bin/python3 "$image_ref" /tests/scripts/test-secret-service.py
