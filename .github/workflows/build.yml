name: bluebuild

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: script syntax
        run: |
          find .github/scripts files/scripts files/system/usr/bin files/compat/usr/libexec \
            files/compat/usr/lib/dracut/modules.d \
            -type f -print0 | while IFS= read -r -d '' script; do
              if head -n 1 "$script" | grep -q '^#!.*python'; then
                python3 -c 'import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text())' "$script"
              else
                bash -n "$script"
              fi
            done

      - name: repository shape
        run: |
          test -f recipes/recipe.yml
          test ! -e recipes/nocblue-hardened.yml
          test ! -e Containerfile
          test ! -d build_files

          grep -q 'name: nocblue$' recipes/recipe.yml
          grep -q 'base-image: ghcr.io/secureblue/silverblue-main-hardened' recipes/recipe.yml
          grep -q 'image-version: latest' recipes/recipe.yml
          grep -q 'ghcr.io/ublue-os/akmods:main-' recipes/recipe.yml
          grep -q 'src=/kernel-rpms' recipes/recipe.yml
          grep -q 'src=/rpms' recipes/recipe.yml
          grep -q 'configure-nocblue-branding.sh' recipes/recipe.yml
          grep -q 'type: initramfs' recipes/recipe.yml
          grep -q 'validate-fedora-openrazer-compat.sh' recipes/recipe.yml
          ! grep -q 'ublue-akmods.repo' recipes/recipe.yml
          # A blanket kernel* exclusion also blocks kernel-headers, which is
          # required by glibc-devel and many development packages.
          ! grep -RIn '^[[:space:]]*- "kernel\*"$' recipes
          grep -q '^[[:space:]]*- kernel$' recipes/recipe.yml
          grep -q '^[[:space:]]*- kernel-core$' recipes/recipe.yml
          grep -q '^[[:space:]]*- kernel-modules$' recipes/recipe.yml
          grep -q '^[[:space:]]*- kernel-modules-core$' recipes/recipe.yml
          grep -q '^[[:space:]]*- kernel-modules-extra$' recipes/recipe.yml
          grep -q '^[[:space:]]*- "kernel-uki\*"$' recipes/recipe.yml

          test -x files/compat/usr/libexec/nocblue/install-fedora-openrazer-compat.sh
          test -x files/compat/usr/libexec/nocblue/validate-fedora-openrazer-compat.sh
          test ! -e files/compat/usr/lib/dracut/dracut.conf.d/98-nocblue-preload-libraries.conf
          test -f files/compat/usr/lib/dracut/dracut.conf.d/98-nocblue-initrd-no-preload.conf
          test -x files/compat/usr/lib/dracut/modules.d/99nocblue-initrd-no-preload/module-setup.sh

          ! grep -RIn '/usr/share/plymouth/themes/spinner/watermark.png' recipes files
          test ! -e files/system/usr/lib/dracut/dracut.conf.d/99-nocblue-installer-tmpdir.conf
          test ! -e files/system/usr/lib/tmpfiles.d/nocblue-installer.conf
          ! grep -RIn 'type: akmods' recipes
          ! grep -RIn 'build-openrazer-akmod.sh' recipes files
          ! grep -Eq '^[[:space:]]*- [^[:space:]#]+-[0-9][^[:space:]]*(\.(x86_64|noarch|aarch64|i686))?$' recipes/recipe.yml
          ! grep -Eq '^[[:space:]]*- (anaconda|anaconda-core|anaconda-dracut|anaconda-install-env-deps|dracut-config-generic|dracut-network|net-tools|squashfs-tools|lorax-templates-generic|biosdevname|prefixdevname|python3-mako)$' recipes/recipe.yml
          ! grep -RInE 'kernel-cachyos|cachyos-settings|dms|DankMaterialShell' recipes manifests README.md

      - name: no private paths
        run: |
          ! grep -RInE '(/home/[[:alnum:]_.-]+/(\.config|Development|Server|Downloads|Documents|Pictures|Videos)|/mnt/[[:alnum:]_.-]+|wallpaperengine|workshop)' \
            recipes files manifests README.md

  bluebuild:
    name: build nocblue image
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: resolve stable release
        id: stable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo python3-yaml
          python3 .github/scripts/prepare-stable-build.py
      - name: build custom image
        uses: blue-build/github-action@v1.13.0
        with:
          skip_checkout: true
          recipe: recipe-build.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: true
          use_cache: false
          rechunk: false
          push: true

      - name: verify candidate image
        id: candidate
        env:
          IMAGE_TAG: ${{ steps.stable.outputs.image_tag }}
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nocblue"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${image_repo}:${IMAGE_TAG}")"
          image_ref="${image_repo}@${digest}"
          cosign verify --key cosign.pub "$image_ref" >/dev/null
          sudo podman run --rm --privileged --hostname desktop --entrypoint /usr/bin/bash "$image_ref" -c '
            set -euo pipefail
            systemd-tmpfiles --create \
              /usr/lib/tmpfiles.d/rpm-ostree-0-integration-opt-usrlocal.conf \
              /usr/lib/tmpfiles.d/99-bluebuild-optfix-*.conf
            /usr/libexec/nocblue/validate-fedora-openrazer-compat.sh
            /usr/bin/nocblue-tests
            sockdir="$(mktemp -d /run/nocblue-bwrap-sock.XXXXXX)"
            trap "rm -rf \"$sockdir\"" EXIT
            python3 -c "import socket, sys; s = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM); s.bind(sys.argv[1])" "$sockdir/socket"
            /usr/bin/bwrap \
              --dev-bind / / \
              --bind "$sockdir" "$sockdir" \
              --ro-bind "$sockdir/socket" "$sockdir/socket" \
              --ro-bind /dev/null /etc/ld.so.preload \
              -- /usr/bin/uv --version >/dev/null
            /usr/bin/bwrap \
              --dev-bind / / \
              --ro-bind /dev/null /etc/ld.so.preload \
              -- /usr/bin/uvx --version >/dev/null
          '
          sudo podman run --rm --network=none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,mode=1777 \
            --volume "$PWD/.github:/tests:ro" \
            --entrypoint /usr/bin/python3 "$image_ref" /tests/scripts/test-secret-service.py
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: publish verified image
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
          FEDORA_RELEASE: ${{ steps.stable.outputs.fedora_release }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nocblue"
          image_tag=latest
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            image_tag="br-${GITHUB_REF_NAME//\//_}-${FEDORA_RELEASE}"
          fi
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          skopeo copy --all --preserve-digests \
            "docker://${image_repo}@${IMAGE_DIGEST}" "docker://${image_repo}:${image_tag}"
