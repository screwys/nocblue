---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# This is the final nocblue desktop image. Its compatibility base retains
# Secureblue userspace while providing Fedora kernel/OpenRazer ABI pairing.
name: nocblue
description: Personal Fedora 44 bootc image with nocblue desktop defaults on the validated Fedora/OpenRazer compatibility base.

base-image: ghcr.io/screwys/nocblue-fedora-openrazer
image-version: latest
platforms:
  - linux/amd64

labels:
  org.opencontainers.image.source: https://github.com/screwys/nocblue

modules:
  - type: dnf
    repos:
      files:
        - niri.repo
        - noctalia-v5.repo
        - terra.repo
        - brave-browser-beta.repo
        - chatgpt.repo
        - helium.repo
        - mullvad.repo
        - librewolf.repo
        - fedora-multimedia.repo
      keys:
        - RPM-GPG-KEY-chatgpt.asc
    install:
      install-weak-deps: false
      allow-erasing: true
      exclude:
        # Protect only the boot/runtime kernel ABI. Development and userspace
        # packages still need kernel-headers, kernel-devel, and kernel-tools.
        - kernel
        - kernel-core
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra
        - "kernel-uki*"
      packages:
        # Desktop/session stack.
        - niri
        - xwayland-satellite
        - noctalia-git
        - noctalia-greeter
        - greetd
        - ghostty
        - qt6ct
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        # COSMIC session and apps, available alongside Niri and GNOME.
        - cosmic-session
        - cosmic-files
        - cosmic-edit
        - cosmic-term
        - cosmic-player
        - cosmic-store
        - fish
        - fastfetch
        - just
        - gh
        - jq
        - nix-core
        - nix-filesystem
        - nodejs24-bin
        - nodejs24-npm-bin
        - pnpm
        - ripgrep
        - fd-find
        - bat
        - eza
        - fzf
        - tree
        - curl
        - wget2-wget
        - unzip
        - 7zip
        - yq
        - direnv
        - neovim
        - socat
        - zoxide
        - btop
        - duf
        - du-dust
        - hyperfine
        - tokei
        - ShellCheck
        - shfmt
        - uv
        # Desktop and user tooling with native Fedora/Terra providers.
        - age
        - chezmoi
        - starship
        - yazi
        - jujutsu
        - ruff
        - gdb
        - mkcert
        - nss-tools
        - sqlite
        - rustup
        - strace
        - dmg2img
        - mingw32-nsis
        - pacman
        - powershell
        - tracy
        - smartmontools
        - heaptrack
        - pandoc-cli
        # Small predefined TeX setup with math and CJK language collections.
        - texlive-scheme-small
        - texlive-collection-mathscience
        - texlive-collection-langchinese
        - texlive-collection-langjapanese
        - texlive-collection-langkorean
        - android-tools
        - java-latest-openjdk-devel
        - golang
        - rust
        - cargo
        - clang
        - rpmdevtools
        - copr-cli
        - rpmlint
        - rust2rpm
        - gcc
        - gcc-c++
        - libasan
        - libubsan
        - make
        - cmake
        - meson
        - ninja-build
        - selinux-policy-devel
        - python3-setools
        - pkgconf-pkg-config
        - libtalloc-devel
        - openssl
        - openssl-devel
        - dbus-devel
        - libepoxy-devel
        - libdrm-devel
        - freeglut-devel
        - ffmpeg-devel
        - mpv-devel
        - clang-tools-extra
        - sdbus-cpp-devel
        - librsvg2-devel
        - polkit-devel
        - wireplumber-devel
        - pam-devel
        - libcurl-devel
        - libsecret-devel
        - libsodium-devel
        - libqalculate-devel
        - libical-devel
        - md4c-devel
        - json-devel
        - tomlplusplus-devel
        - libwebp-devel
        - libjxl-devel
        - libsndfile-devel
        - stb_image_resize2-devel
        - stb_image_write-devel
        - jemalloc-devel
        - gstreamer1-devel
        - gstreamer1-plugins-base-devel
        - gstreamer1-plugins-bad-free-devel
        - patch
        - no_rlimit_as

        # Desktop apps and integration.
        - gnome-keyring
        - dbus-tools
        - polkit
        - nautilus
        - nautilus-python
        - loupe
        - showtime
        - mpv
        - kdenlive
        - gimp
        - gpu-screen-recorder
        - gpu-screen-recorder-gtk
        - sushi
        - ark
        - gnome-boxes
        - virt-manager
        - virt-install
        - virt-viewer
        - libvirt-client
        - libvirt-daemon-kvm
        - qemu-kvm
        - fcitx5
        - fcitx5-mozc
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
        - adwaita-cursor-theme
        - google-noto-sans-cjk-fonts
        - firewalld
        - flatpak
        - flatpak-builder
        - podman-docker
        - podman-compose
        - nm-connection-editor
        - NetworkManager-tui
        - NetworkManager-wifi
        - bubblewrap
        - xdg-dbus-proxy

        # System and boot tools.
        - pipx
        - mokutil
        - kmod
        - cryptsetup
        - tpm2-tools
        - zram-generator
        - xz
        - zstd
        - dracut

        # Wayland, OCR, gaming, local services, and browsers.
        - wl-clipboard
        - grim
        - slurp
        - wf-recorder
        - cliphist
        - wlsunset
        - wl-mirror
        - wtype
        - brightnessctl
        - ddcutil
        - libnotify
        - ImageMagick
        - tesseract
        - tesseract-langpack-eng
        - tesseract-langpack-jpn
        - tesseract-langpack-jpn_vert
        - kde-connect
        - kde-connect-nautilus
        - kf6-kitemmodels
        - radicale3
        - radicale3-selinux
        - nginx
        - input-remapper
        - libinput-utils
        - gamescope
        - mangohud
        - steam-devices
        - vulkan-tools
        - vkBasalt
        - firefox
        - brave-origin-beta
        - helium-bin
        - librewolf
        - mullvad-browser
        - zed
        - libappindicator-gtk3
        - chatgpt
        - "postgresql-contrib"
        - "postgresql-server"
    remove:
      auto-remove: false
      packages:
        # Secureblue ships Docker, but nocblue deliberately keeps Podman as
        # the container engine and lets podman-docker own /usr/bin/docker.
        - docker-ce
        - docker-ce-cli
        - docker-ce-rootless-extras
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - ptyxis
        - gnome-terminal
        - gnome-terminal-nautilus
        - gnome-console
        - kgx
        - gnome-classic-session

  - type: dnf
    install:
      install-weak-deps: false
      skip-unavailable: true
      exclude:
        # Protect only the boot/runtime kernel ABI. Development and userspace
        # packages still need kernel-headers, kernel-devel, and kernel-tools.
        - kernel
        - kernel-core
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra
        - "kernel-uki*"
      packages:
        - adw-gtk3-theme
        - umu-launcher
        - scx-scheds
        - scx-tools

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - install-candy-icons.sh
      - install-code-tools.sh
      - configure-nocblue-branding.sh
      - install-pywalfox.sh
      - install-browser-policies.sh
      - configure-hardened-portal.sh
      - configure-standard-malloc-browsers.sh
      - configure-chatgpt.sh
      - configure-file-manager-launchers.sh
      - compile-file-manager-selinux.sh
      - configure-sandbox-userns-selinux.sh
      - configure-flatpak-builder-hardened.sh
      - install-protonvpn.sh
      - configure-nix.sh
      - install-uv-launchers.sh
      - configure-anticheat-support.sh
      - build-loupe-reuse-window.sh
      - patch-native-media-apps.sh

  - type: systemd
    system:
      enabled:
        - nocblue-session-defaults.service
        - nix.mount
        - input-remapper.service
        - firewalld.service
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - me.proton.vpn.split_tunneling.service
        - greetd.service
      masked:
        - rpm-ostree-countme.timer
        - geoclue.service
        - sshd.service
        - sshd.socket
        - sshd-keygen.target
    user:
      enabled:
        - secureblue-flatpak-setup.timer
        - flatpak-user-update.timer
        - nocblue-flatpak-setup.timer
        - nocblue-adwsteamgtk.timer
        - nocblue-game-shortcuts-sync.timer
        - nocblue-icon-theme-sync.timer
        - nocblue-nix-gc.timer
        - nocblue-nix-profile-setup.service
        - nocblue-flatpak-icon-fixes.service
        - noctalia.service
      masked:
        - security-update-notification.path
        - security-update-notification.service

  # Nocblue may update preload libraries after inheriting the compatibility
  # base, so regenerate and revalidate the final initramfs as the last mutable
  # boot-related operation.
  - type: containerfile
    snippets:
      - RUN ldconfig && glib-compile-schemas /usr/share/glib-2.0/schemas

  - type: initramfs

  - type: containerfile
    snippets:
      - RUN /usr/libexec/nocblue/validate-fedora-openrazer-compat.sh

  # Keep normal GNOME as a complete fallback even though greetd starts Niri by default.
  - type: containerfile
    snippets:
      - >-
        RUN rpm -q secureblue-logos gdm gnome-shell gnome-session-wayland-session gnome-control-center &&
        ! rpm -q gnome-classic-session >/dev/null 2>&1 &&
        test -f /usr/share/wayland-sessions/gnome.desktop &&
        test ! -e /usr/share/wayland-sessions/gnome-classic.desktop &&
        test -f /usr/share/applications/org.gnome.Settings.desktop &&
        test -f /usr/share/wayland-sessions/niri.desktop

  - type: signing
